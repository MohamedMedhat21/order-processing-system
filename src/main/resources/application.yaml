spring:
  application:
    name: order-processing-system

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/order_processing}
    username: ${SPRING_DATASOURCE_USERNAME:ops}
    password: ${SPRING_DATASOURCE_PASSWORD:ops}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}

  cache:
    type: redis

  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME:guest}
    password: ${SPRING_RABBITMQ_PASSWORD:guest}

app:
  jwt:
    secret: ${JWT_SECRET:bW9oYW1lZC1kZXYtand0LXNlY3JldC0zMi1ieXRlcyEh}
    expiration-ms: ${JWT_EXPIRATION_MS:3600000}
    refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000}
  rate-limit:
    order-creation:
      capacity: ${ORDER_RATE_LIMIT_CAPACITY:10}
      refill-tokens: ${ORDER_RATE_LIMIT_REFILL_TOKENS:10}
      refill-period-seconds: ${ORDER_RATE_LIMIT_REFILL_PERIOD_SECONDS:60}
  inventory:
    low-stock-threshold: ${LOW_STOCK_THRESHOLD:5}
  notifications:
    processing-delay-ms: ${NOTIFICATION_PROCESSING_DELAY_MS:0}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: when_authorized
  health:
    redis:
      enabled: true
    rabbit:
      enabled: true

server:
  port: ${SERVER_PORT:8080}
