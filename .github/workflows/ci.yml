name: CI

on:
  pull_request:
    branches: [ integration, main ]
  push:
    branches: [ integration ]

# CodeQL is handled by GitHub's default code scanning setup (repo Settings →
# Code Security). A custom CodeQL job here conflicts with default setup and
# fails SARIF upload with "advanced configurations cannot be processed".
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & test (incl. concurrency suite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # Testcontainers needs a Docker daemon — ubuntu-latest runners ship
      # with one preinstalled, no extra services block needed.
      - name: Build and run full test suite
        run: ./mvnw -B clean verify

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports
          retention-days: 7

  # Only run the full-stack smoke test when promoting into main — this is
  # the "clean docker compose up from a fresh clone" gate from AGENTS.md.
  compose-smoke-test:
    name: Full-stack compose smoke test
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.base_ref == 'main'

    steps:
      - uses: actions/checkout@v4

      - name: Prepare Compose env
        run: cp .env.example .env

      - name: Start full stack (app + Postgres + Redis)
        run: docker compose up -d --wait

      - name: Hit health endpoint
        run: curl --fail --retry 5 --retry-delay 3 http://localhost:8080/actuator/health

      - name: Tear down
        if: always()
        run: docker compose down -v